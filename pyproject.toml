[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "silver-ai"
version = "0.1.9"
description = "Deterministic state-guardrails for agentic hardware & critical systems."
authors = ["Goh Chun Lin <chunlin@live.com.sg>"]
readme = "README.md"
license = "Apache-2.0"
homepage = "https://github.com/gcl-team/SilverAi"
repository = "https://github.com/gcl-team/SilverAi"
keywords = ["ai", "agents", "safety", "guardrails", "robotics", "iot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Framework :: Pydantic",
]
packages = [{include = "silver_ai", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.11, <3.15"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
ruff = "^0.15.13"
deptry = "^0.23.1"
arize-phoenix = "^15.10.0"
arize-phoenix-otel = "^0.16.1"
greenlet = "^3.5.0"
prettytable = "^3.10.0"

[tool.deptry]
ignore_notebooks = true
exclude = [".venv", "venv", ".git", "__pycache__", "tests", "demo"]

# --- Ruff Configuration (Linting + Security) ---
[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
# E: pycodestyle, F: pyflakes, I: isort, S: bandit (security)
select = ["E", "F", "I", "S"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["silver_ai"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"demo/**/tests/*" = ["S101"]
