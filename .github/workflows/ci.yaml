name: SilverAi CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      demo_sorter: ${{ steps.filter.outputs.demo_sorter }}

    steps:
      - uses: actions/checkout@v4

      - name: Detect Path Changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            demo_sorter:
              - 'demo/gemma4-industrial-sorter/**'

  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Python 3.14+ not yet supported due to Phoenix/greenlet compatibility
        python-version: ["3.11", "3.13"]

    steps:
      # 1. Check out the code
      - uses: actions/checkout@v4

      # 2. Install Python
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # 3. Install Poetry (The Manager)
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      # 4. Install dependencies and project
      - name: Install dependencies
        run: poetry install --no-interaction

      # 5. Check for ghost dependencies
      - name: Check for Ghost Dependencies
        run: poetry run deptry .

      # 6. Run Security & Linting (Ruff)
      - name: Run Linting & Security (Ruff)
        run: poetry run ruff check .

      # 7. Run Tests
      - name: Run Core Tests
        run: poetry run pytest tests

      # 8. Check the library size
      - name: Build and Check Size
        run: |
          poetry build
          echo "Checking package size..."

          # Get size in KB
          LIB_SIZE_KB=$(du -sk dist/*.whl | cut -f1)
          echo "Size: ${LIB_SIZE_KB}KB"

          # Fail if > 20KB
          if [ "$LIB_SIZE_KB" -gt 20 ]; then
            echo "❌ ERROR: SilverAi is too fat! (${LIB_SIZE_KB}KB > 20KB)"
            exit 1
          else
            echo "✅ Optimization Pass: Library is lean."
          fi

      # 9. Check the total size with dependencies
      - name: Check Total Install Size
        run: |
          echo "🧪 Creating a fresh environment..."
          python -m venv .simulated_env
          source .simulated_env/bin/activate

          # 1. Install the wheel
          pip install dist/*.whl

          # 2. Locate site-packages
          SITE_PACKAGES=$(python -c "import site; print(site.getsitepackages()[0])")

          # 3. Measure ONLY the 'silver_ai' folder
          # This ignores 'pip' and 'setuptools' overhead
          LIB_SIZE_KB=$(du -sk $SITE_PACKAGES/silver_ai | cut -f1)

          echo "📦 SilverAi Installed Size: ${LIB_SIZE_KB}KB"

          # 4. Fail if > 100KB
          if [ "$LIB_SIZE_KB" -gt 100 ]; then
            echo "❌ ERROR: SilverAi is too fat! (${LIB_SIZE_KB}KB > 100KB)"
            exit 1
          else
            echo "✅ Optimization Pass: Library is lean."
          fi

  demo-sorter-tests:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.demo_sorter == 'true'

    strategy:
      matrix:
        # Python 3.14+ not yet supported due to Phoenix/greenlet compatibility
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run Demo Sorter Tests
        run: poetry run pytest demo/gemma4-industrial-sorter/tests
